<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChopChop - Group Invite</title>

  <!-- Open Graph for link previews -->
  <meta property="og:title" content="You've been invited to a ChopChop group!">
  <meta property="og:description" content="Tap to join the group and start splitting bills together.">
  <meta property="og:type" content="website">
  <!--
    A 192x192 favicon was here, which is below what the scrapers accept — Messenger showed a blank
    card rather than a small one. This is a proper 1200x630 preview.
  -->
  <meta property="og:image" content="https://chopchop.cz/icons/og-invite.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ChopChop — invitation to a group">
  <meta property="og:site_name" content="ChopChop">
  <meta property="og:url" content="https://chopchop.cz/invite/">

  <meta name="description" content="Someone invited you to a group on ChopChop. Split expenses without the maths or the arguing.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You've been invited to a ChopChop group!">
  <meta name="twitter:description" content="Tap to join the group and start splitting bills together.">
  <meta name="twitter:image" content="https://chopchop.cz/icons/og-invite.png">

  <!--
    Served for every /invite/* request (see /srv/infra/Caddyfile). It used to be shadowed by a
    302 to app.chopchop.cz, which meant link previews scraped the web app's index.html — no og:
    tags there, hence the blank card. Humans are forwarded on by the script below; on iOS the
    universal link opens the app before this is ever fetched.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .invite-card {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .invite-card img {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    .invite-card h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .invite-card p {
      font-size: 16px;
      color: #999;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-primary {
      background: #A057FF;
      color: #fff;
    }

    .btn-secondary {
      background: transparent;
      color: #A057FF;
      border: 2px solid #A057FF;
      margin-top: 12px;
    }

    .store-links {
      margin-top: 24px;
    }

    .store-links p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="invite-card">
    <img src="/icons/favicon-192x192.png" alt="ChopChop">
    <h1>You've been invited!</h1>
    <p id="inviteMsg">Opening your invitation…</p>

    <a id="openInviteBtn" class="btn btn-primary" href="https://app.chopchop.cz">Open invitation</a>

    <div class="store-links">
      <p>Don't have the app yet?</p>
      <a class="btn btn-secondary" href="https://chopchop.cz">Get ChopChop</a>
    </div>
  </div>

  <script>
    (function() {
      // Extract invite ID from URL path or query param (from 404 redirect)
      var inviteId = null;
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length >= 2 && pathParts[0] === 'invite' && pathParts[1] !== 'index.html') {
        inviteId = pathParts[1];
      }
      if (!inviteId) {
        var params = new URLSearchParams(window.location.search);
        inviteId = params.get('id');
      }

      var btn = document.getElementById('openInviteBtn');
      if (inviteId) {
        // Open the invitation in the web app (works on desktop and mobile web).
        var target = 'https://app.chopchop.cz/invite/' + encodeURIComponent(inviteId);
        btn.href = target;
        window.location.replace(target);
      } else {
        // No invite id — nothing to open; point users at the app instead.
        document.getElementById('inviteMsg').textContent =
          'This invitation link looks incomplete. Open ChopChop to continue.';
        btn.href = 'https://app.chopchop.cz';
      }
    })();
  </script>
</body>
</html>
